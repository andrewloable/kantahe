syntax = "proto3";

package kantahe.v1;

// How a song entry is stored: an MP3 (from a .karmp3) or a MIDI file (.kar).
enum Format {
  FORMAT_UNSPECIFIED = 0;
  FORMAT_MP3 = 1;
  FORMAT_MIDI = 2;
}

// Kind of client a device is; chosen by the client at sign-in and never trusted for permissions.
enum DeviceType {
  DEVICE_TYPE_UNSPECIFIED = 0;
  DEVICE_TYPE_WEB = 1;
  DEVICE_TYPE_ANDROID = 2;
  DEVICE_TYPE_IOS = 3;
  DEVICE_TYPE_ANDROID_TV = 4;
  DEVICE_TYPE_TIZEN = 5;
  DEVICE_TYPE_WEBOS = 6;
}

// Per-device MIDI synthesis choice (plan 4.1); AUTO lets the server decide from memory and dropouts.
enum MidiMode {
  MIDI_MODE_UNSPECIFIED = 0;
  MIDI_MODE_AUTO = 1;
  MIDI_MODE_FULL = 2;
  MIDI_MODE_LOW_POWER = 3;
  MIDI_MODE_SERVER = 4;
}

// One library entry; number is unique and never changes (plan 6). Visible to every signed-in user.
message Song {
  string number = 1;
  Format format = 2;
  string title = 3;
  string artist = 4;
  string songbook_number = 5;
  int64 duration_ms = 6;
  // True when the file could not be read; such songs are excluded from random fill.
  bool failed = 7;
  // Whether the calling user has favourited it; always scoped to the caller.
  bool favourite = 8;
}

// One lyric word with its wipe window in milliseconds (plan 3).
message LyricWord {
  string text = 1;
  int64 start_ms = 2;
  int64 end_ms = 3;
}

// One displayed line; words are in order and never overlap.
message LyricLine {
  int64 start_ms = 1;
  int64 end_ms = 2;
  repeated LyricWord words = 3;
}

// All lyrics of a song, parsed by the server (D1); source is "lrc" or "kar".
message Lyrics {
  string number = 1;
  string source = 2;
  int64 duration_ms = 3;
  repeated LyricLine lines = 4;
}

// An account; password data is never sent. Only admins see other users.
message User {
  string id = 1;
  string email = 2;
  string display_name = 3;
  bool admin = 4;
  bool uploader = 5;
  bool must_change_password = 6;
  bool disabled = 7;
}

// A signed-in device of one user; is_caller marks the device making the request.
message Device {
  string id = 1;
  string name = 2;
  DeviceType type = 3;
  bool online = 4;
  bool mic_available = 5;
  int32 memory_mb = 6;
  // What the user chose; effective_midi_mode is what the server resolved from it.
  MidiMode midi_mode = 7;
  MidiMode effective_midi_mode = 8;
  bool is_caller = 9;
  int64 last_seen_unix = 10;
}

// A device token with its user; the token is shown once and only its hash is stored (plan 5).
message AuthToken {
  string token = 1;
  string device_id = 2;
  User user = 3;
}
