# HTTPS in front of Kantahe with nginx (1.25.1 or newer for "http2 on"). A complete file so that
# "nginx -t -c" can check it; in an existing setup copy the server blocks into your own http block.
# Replace the host name and the certificate paths (for example from certbot).
events {}

http {
	server {
		listen 80;
		server_name karaoke.example.com;
		return 301 https://$host$request_uri;
	}

	server {
		listen 443 ssl;
		http2 on;
		server_name karaoke.example.com;
		ssl_certificate     /etc/letsencrypt/live/karaoke.example.com/fullchain.pem;
		ssl_certificate_key /etc/letsencrypt/live/karaoke.example.com/privkey.pem;

		# Uploads: this must stay above the server's own upload limit (default 50 MiB, at most 1 GiB).
		client_max_body_size 64m;

		proxy_http_version 1.1;
		proxy_set_header Connection "";
		proxy_set_header Host $host;
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		proxy_set_header X-Forwarded-Proto $scheme;

		location / {
			proxy_pass http://127.0.0.1:8080;
		}

		# Streaming responses: no buffering, and a read timeout longer than the quietest moment of a stream.
		location = /kantahe.v1.SessionService/WatchState {
			proxy_pass http://127.0.0.1:8080;
			proxy_buffering off;
			proxy_read_timeout 1h;
		}
		location = /kantahe.v1.AuthService/WaitCodeLogin {
			proxy_pass http://127.0.0.1:8080;
			proxy_buffering off;
			proxy_read_timeout 1h;
		}

		# The server answers an upload only after it has imported the file.
		location = /kantahe.v1.UploadService/UploadSong {
			proxy_pass http://127.0.0.1:8080;
			proxy_send_timeout 5m;
			proxy_read_timeout 5m;
		}
	}
}
