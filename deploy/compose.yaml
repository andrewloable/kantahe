# docker compose -f deploy/compose.yaml up -d
# Then open http://localhost:8080 and create the first (admin) account.
services:
  kantahe:
    image: ghcr.io/andrewloable/kantahe:latest
    ports:
      - "8080:8080"
    volumes:
      # database, uploaded songs and settings
      - kantahe-data:/data
      # Your karaoke folder. Add ":ro" (/path/to/karaoke:/library:ro) if admins must not be able to
      # delete songs from it. Uploaded songs are kept in the data volume, not here.
      - /path/to/karaoke:/library
      # A folder for Admin -> Transfer (export and import); it must be readable and writable by user 65532. Optional.
      # - /path/to/transfer:/transfer
    restart: unless-stopped
    # So that the apps find the server on the network by themselves (it announces itself over mDNS, which does not
    # leave Docker's default network), use the host's network instead of the ports above: remove the "ports:" lines,
    # then uncomment the next two lines. The listen port is then the one clients use (KANTAHE_LISTEN, default :8080).
    # network_mode: host
    # environment: { KANTAHE_NAME: "Living room karaoke" }
    # Behind a reverse proxy, tell the server its public address (shown to TVs as the approval link):
    # command: ["--data", "/data", "--library", "/library", "--listen", ":8080", "--public-url", "https://karaoke.example.com"]
    # To allow export and import only inside the mounted transfer folder, add "--transfer-root", "/transfer" to the command above,
    # or: environment: { KANTAHE_TRANSFER_ROOT: "/transfer" }

volumes:
  kantahe-data:
