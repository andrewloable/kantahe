name: ci

# Nothing runs on ordinary pushes or pull requests. These checks run as the first step of a release
# (release.yml calls this file) and by hand from the Actions tab.
on:
  workflow_call:
  workflow_dispatch:

jobs:
  go:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod
      - run: go vet ./...
      - run: test -z "$(gofmt -l .)"
      - run: CGO_ENABLED=0 go build ./...
      - run: go test -race ./...

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npx ng lint
      - run: npx ng test --watch=false
      - run: npx ng build
      - run: npx ng build --configuration tizen
      - run: npx ng build --configuration webos

  scripts-and-docs:
    # the TV package files and the helper scripts, and the links in the Markdown docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: sudo apt-get install -y libxml2-utils
      - run: xmllint --noout tv/tizen/config.xml
      - run: python3 -m unittest discover -s tv/tizen
      - run: python3 -m unittest discover -s tv/webos
      - run: python3 -m unittest discover -s scripts -p 'test_check_links.py'
      - run: python3 scripts/check-links.py

  e2e:
    # one run of the whole product: the real server with a synthetic library, the web app, a real browser
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npx playwright install --with-deps chromium
        working-directory: web
      - run: npm run e2e
        working-directory: web
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-traces
          path: web/test-results

  release-build:
    # the release script end to end: web app and SoundFont embedded, six binaries, the linux one started
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: scripts/build-release.sh v0.0.0-test
      - run: test "$(ls dist | wc -l)" = 7
      - run: (cd dist && sha256sum -c SHA256SUMS)
      - run: scripts/smoke-release.sh dist/kantahe-v0.0.0-test-linux-amd64 v0.0.0-test
      # the embedded files must not show up in the working tree
      - run: test -z "$(git status --porcelain -- server/internal/webui server/internal/assets)"

  docker:
    # the image on both architectures (arm64 under emulation): version, non-root user, web app, restart keeps the data
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        platform: [linux/amd64, linux/arm64]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - run: docker buildx build --platform ${{ matrix.platform }} --build-arg VERSION=v0.0.0-test -t kantahe:test --load .
      - run: scripts/smoke-docker.sh kantahe:test v0.0.0-test ${{ matrix.platform }}

  deploy-files:
    # the proxy examples are accepted by Caddy and nginx, the systemd unit passes systemd-analyze
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: scripts/check-proxy-configs.sh
      # systemd-analyze verify wants the program, the user and the folder to exist
      - run: |
          sudo useradd --system --no-create-home --shell /usr/sbin/nologin kantahe
          sudo install -m 755 /bin/true /usr/local/bin/kantahe
          sudo install -d /srv/karaoke
      - run: systemd-analyze verify deploy/systemd/kantahe.service

  flutter:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

  flutter-android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      - run: flutter build apk --debug

  flutter-ios:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      - run: flutter build ios --simulator --no-codesign --debug

  buf:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: bufbuild/buf-action@v1
        with:
          lint: true
          breaking: false
          format: false
      - run: buf generate
      # git status (not git diff) so that newly generated, untracked files are caught too
      - run: test -z "$(git status --porcelain -- server/gen web/src/gen app/lib/gen)"
