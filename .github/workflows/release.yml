name: release

# Pushing a tag such as v0.1.0 builds the binaries and attaches them to a GitHub release.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: scripts/build-release.sh "$GITHUB_REF_NAME"
      - run: scripts/smoke-release.sh "dist/kantahe-$GITHUB_REF_NAME-linux-amd64" "$GITHUB_REF_NAME"
      - run: gh release create "$GITHUB_REF_NAME" dist/* --title "$GITHUB_REF_NAME" --generate-notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  image:
    # the multi-arch image on ghcr.io; "latest" only moves for versions without a pre-release suffix
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: VERSION=${{ github.ref_name }}
          tags: |
            ghcr.io/andrewloable/kantahe:${{ github.ref_name }}
            ${{ !contains(github.ref_name, '-') && 'ghcr.io/andrewloable/kantahe:latest' || '' }}
